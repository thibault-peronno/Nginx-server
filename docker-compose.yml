version: "3.8"
services:
  nginx:
    container_name: nginx_master
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/servers-nginx.conf:/etc/nginx/conf.d/servers-nginx.conf
      - ./certs:/etc/letsencrypt
      - /var/run/docker.sock:/tmp/docker.sock
      - /etc/letsencrypt/live/thibault-peronno.fr/fullchain.pem:/etc/nginx/ssl/fullchain.pem
      - /etc/letsencrypt/live/thibault-peronno.fr/privkey.pem:/etc/nginx/ssl/privkey.pem
    networks:
      - projects_thibault_network
    command: nginx -g 'daemon off;'
  mysqldb:
    container_name: mysql
    env_file:
      - path: .env
        required: true # default
    image: mysql:8.0.35
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    environment:
      - MYSQL_ROOT_USER={USER_ROOT}
      - MYSQL_ROOT_PASSWORD=${DBROOT}
      - MYSQL_DATABASE=${DATABASE_MYSQL}
      - MYSQL_USER=${USER_MYSQL}
      - MYSQL_PASSWORD=${PASSWORD_MYSQL}
    ports:
      - "3306"
    volumes:
      - ./to_do_list.sql:/docker-entrypoint-initdb.d/1.sql
      - db_data:/var/lib/mysql
    networks:
      - projects_thibault_network
  # service Adminer
  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 8082:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysqldb
    depends_on:
      - mysqldb
    env_file:
      - .env
    networks:
      - projects_thibault_network
volumes:
  db_data: {}
  interface_volume:
networks:
  projects_thibault_network:
    name: projects_thibault_network
    driver: bridge
